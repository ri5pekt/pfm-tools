version: "3.9"

services:
    db:
        image: postgres:16
        environment:
            POSTGRES_DB: pfmtools
            POSTGRES_USER: pfmtools
            POSTGRES_PASSWORD: pfmtools
        volumes:
            - db_data:/var/lib/postgresql/data
        ports:
            - "5434:5432"

    redis:
        image: redis:7
        ports:
            - "6380:6379"

    backend:
        build:
            context: ./backend
        env_file:
            - .env
        volumes:
            - ./backend:/app
            - ./data:/data
        depends_on:
            - db
            - redis
        ports:
            - "8001:8000"
        command: >
            uvicorn app.main:app
            --host 0.0.0.0
            --port 8000
            --reload

    worker:
        build:
            context: ./backend
        env_file:
            - .env
        volumes:
            - ./backend:/app
            - ./data:/data
        depends_on:
            - backend
            - redis
        command: >
            python -m worker

    worker2:
        build:
            context: ./backend
        env_file:
            - .env
        volumes:
            - ./backend:/app
            - ./data:/data
        depends_on:
            - backend
            - redis
        command: >
            python -m worker

    scheduler:
        build:
            context: ./backend
        env_file:
            - .env
        volumes:
            - ./backend:/app
            - ./data:/data
        depends_on:
            - redis
            - db
        command: >
            sh -c "python scheduler.py && exec rqscheduler --url $${REDIS_URL} --interval 1 --verbose"

    # Frontend - run locally with 'npm run dev' in frontend/ directory for hot reload
    # Uncomment below to use Docker container instead (production build, no hot reload)
    # frontend:
    #     build:
    #         context: ./frontend
    #         args:
    #             VITE_API_BASE_URL: /api
    #     ports:
    #         - "5173:80"
    #     depends_on:
    #         - backend

volumes:
    db_data:
