version: "3.9"

# Production docker-compose with configurable worker scaling
# Usage: WORKER_COUNT=4 docker-compose -f docker-compose.prod.yml up -d

services:
    db:
        image: postgres:16
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-pfmtools}
            POSTGRES_USER: ${POSTGRES_USER:-pfmtools}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pfmtools}
        volumes:
            - db_data:/var/lib/postgresql/data
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pfmtools}"]
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    backend:
        build:
            context: ./backend
        env_file:
            - .env
        volumes:
            - ./data:/data
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        ports:
            - "${BACKEND_PORT:-8000}:8000"
        restart: unless-stopped
        command: >
            uvicorn app.main:app
            --host 0.0.0.0
            --port 8000
            --workers ${BACKEND_WORKERS:-2}
            --no-reload

    # Worker template - will be scaled using docker-compose scale command
    worker:
        build:
            context: ./backend
        env_file:
            - .env
        volumes:
            - ./data:/data
        depends_on:
            backend:
                condition: service_started
            redis:
                condition: service_healthy
        restart: unless-stopped
        command: >
            python -m worker

volumes:
    db_data:

